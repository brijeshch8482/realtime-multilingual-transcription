# One-click deploy on Render: Dashboard -> New -> Blueprint -> pick this repo.
# You'll be asked for GEMINI_API_KEY; everything else is wired automatically.
services:
  - type: web
    name: speech-to-text
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: speech-to-text-db
          property: connectionString

databases:
  - name: speech-to-text-db
    plan: free
    databaseName: transcriptions
